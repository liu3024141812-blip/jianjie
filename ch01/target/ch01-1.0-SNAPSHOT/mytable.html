<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<title>表格</title>
	</head>
	<body style="background-color: aqua; background-image: url(./img/back.png)  ;background-repeat: no-repeat;background-size: cover;">
		<table border="1"
		 style="width: 50%; height: 200px; " 
		 align="center">
			<caption>
				<h3>班级成绩表</h3>
			</caption>
			<thead>
				<tr>
					<th> 排名</th>
					<th> 姓名</th>
					<th> 分数</th>
					<th> 备注</th>
				</tr>
			</thead>
			<tbody>
				<tr>
					<td> 1</td>
					<td> 小明</td>
					<td> 100</td>
					<td rowspan="3" align="center" > 第一名获得奖学金</td>
				</tr>
				<tr>
					<td> 2</td>
					<td> 小红</td>
					<td> 96</td>
					
				</tr>
				<tr>
					<td> 平均分</td>
					<td colspan="2" align="center" >98 </td>
				</tr>
				<tr>
					<td colspan="4" align="center">计科3班</td>
				</tr>
				
			</tbody>
		</table>
	</body>
</html>
