<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<title>多栏布局</title>
		<style>
			/*共性 个性   */
			.header,.footer{
				width: 500px;
				height: 100px;
				background: pink;
			}
			.main{
				width: 500px;
				height: 300px;
			}
			.left,.right{
				width: 100px;
				height: 300px;
				
			}
			.content{
			    width: 300px;
			    height: 300px;      
			}
			
			.content-top,.content-bot{
				width: 300px;
				height: 150px;
				
			}
			.left{
				background:blue ;
				float:left;
			}
			.right{
				background:black ;
				float:right;
			}
			
			.content{
				background: beige;
				float: left;
			}
			.content-top{
				background: red;
			}
			.content-bot{
				background:orange ;
			}
			
		</style>
	</head>
	<body>
		<div class="header"> </div>
		<div class="main"> 
		<div class="left"> </div>
		<div class="content">
			<div class="content-top"></div>
			<div class="content-bot"></div>
			</div>
		<div class="right"></div>
		
		</div>
		<div class="footer"></div>
	</body>
</html>
